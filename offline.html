<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Savage Command Center</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a14;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px;
      text-align: center;
    }
    .icon { font-size: 64px; margin-bottom: 24px; }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 12px; color: #8b5cf6; }
    p { color: #9ca3af; font-size: 16px; max-width: 400px; line-height: 1.6; }
    button {
      margin-top: 32px;
      padding: 12px 28px;
      background: #8b5cf6;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #7c3aed; }
  </style>
</head>
<body>
  <div class="icon">⚡</div>
  <h1>You're offline</h1>
  <p>Savage Command Center needs a network connection to reach your integrations. Check your connection and try again.</p>
  <button onclick="window.location.reload()">Retry</button>
</body>
</html>
