name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  lint-and-validate:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install HTML validator
        run: npm install -g htmlhint

      - name: Validate HTML
        run: htmlhint index.html --config .htmlhintrc

      - name: Check for Math.random() outside test files
        run: |
          # Math.random() is banned in production code (non-determinism)
          if grep -rn "Math\.random()" --include="*.js" \
               --exclude-dir=node_modules \
               --exclude="*.test.js" \
               --exclude="*.spec.js" \
               --exclude="*test*" \
               .; then
            echo "❌ Math.random() found in production code. Replace with deterministic logic."
            exit 1
          else
            echo "✅ No Math.random() in production code."
          fi

      - name: Check manifest.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('✅ manifest.json is valid JSON')"

      - name: Check sw.js exists
        run: |
          if [ -f "sw.js" ]; then
            echo "✅ Service worker exists"
          else
            echo "❌ sw.js missing"
            exit 1
          fi

      - name: Check app.js has no syntax errors
        run: node --check app.js && echo "✅ app.js syntax OK"

      - name: Verify loadMetrics is wired to CEROS endpoint
        run: |
          if grep -q "loadMetrics" app.js && grep -q "organism-status" app.js; then
            echo "✅ loadMetrics wired to CEROS /api/organism-status"
          else
            echo "❌ loadMetrics not wired to CEROS /api/organism-status"
            exit 1
          fi

      - name: Verify DOM-to-JS selector binding (Replay Theater, Pressure Board, Terminal, Cockpit)
        run: |
          node -e "
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const js = fs.readFileSync('app.js', 'utf8');
          ['panel-ide', 'panel-replay', 'panel-pressure', 'terminal-input', 'terminal-body', 'metrics-refresh-btn', 'cockpit-organism'].forEach(id => {
            if (!html.includes(id)) throw new Error('Missing DOM element #' + id);
            if (!js.includes(id)) throw new Error('Unbound JS reference #' + id);
          });
          console.log('✅ DOM & JS IDs 100% synchronized');
          "

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test
