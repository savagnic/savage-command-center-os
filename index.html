<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savage Revenue Cockpit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Savage Revenue Cockpit</h1>
            <nav>
                <button onclick="showSection('evaluate')">Evaluate</button>
                <button onclick="showSection('govern')">Govern</button>
                <button onclick="showSection('deploy')">Deploy</button>
                <button onclick="showSection('proof-vault')">Proof Vault</button>
            </nav>
        </header>
        <main>
            <section id="evaluate" class="cockpit-section">
                <h2>CEROS Triadic Evaluation</h2>
                <div id="triadic-metrics">Loading metrics...</div>
                <div id="breakthrough-list">Loading breakthroughs...</div>
            </section>
            <section id="govern" class="cockpit-section" style="display:none;">
                <h2>Infineum Governance</h2>
                <div id="constitutional-status">Status: STABLE</div>
            </section>
            <section id="deploy" class="cockpit-section" style="display:none;">
                <h2>AgentShell Deployment</h2>
                <div id="swarm-map">Active Swarms: 0</div>
            </section>
            <section id="proof-vault" class="cockpit-section" style="display:none;">
                <h2>AgentPay Proof Vault</h2>
                <div id="decision-replay">Decision Replay Theater</div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
